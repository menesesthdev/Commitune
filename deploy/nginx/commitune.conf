# Nginx site for commitune.menesesthdev.com.br
#
# Install:
#   sudo cp deploy/nginx/commitune.conf /etc/nginx/sites-available/commitune
#   sudo ln -s /etc/nginx/sites-available/commitune /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate has to exist before this file is enabled, or nginx will not
# start — see docs/deploy.md, which issues it first with `certbot certonly`.
#
# proxy_pass targets API_HOST_PORT from .env (5000 by default). If another
# project on this host already uses that port, both have to change together.

server {
    listen 80;
    listen [::]:80;
    server_name commitune.menesesthdev.com.br;

    # Left reachable over HTTP so certbot can renew without a reload dance.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name commitune.menesesthdev.com.br;

    ssl_certificate     /etc/letsencrypt/live/commitune.menesesthdev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commitune.menesesthdev.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # This host is HTTPS only. No includeSubDomains: it would speak for every
    # other name under menesesthdev.com.br, which is not this project's call.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/commitune.access.log;
    error_log  /var/log/nginx/commitune.error.log;

    # Telegram posts a small JSON update; nothing here accepts an upload.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # X-Telegram-Bot-Api-Secret-Token has to reach the app untouched — it is
        # what the webhook authenticates on. Nginx forwards unknown headers by
        # default; do not add proxy_set_header rules that drop it.

        # An update is processed inline (no queue), and Telegram gives up on us
        # well before this. A timeout here should look like a failure, not a hang.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # No auth on /health by design: it reports liveness only, no version, no
    # configuration, nothing about any user.
    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }
}
