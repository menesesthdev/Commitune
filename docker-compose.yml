services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_PROTECTION_KEY_PATH: /keys
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dpkeys:/keys
    # Bound to the loopback on purpose: in production Nginx terminates TLS and proxies to
    # this port. Publishing on 0.0.0.0 would put the API on the internet in plain HTTP,
    # secret-token check and all, next to the door it is supposed to be behind.
    # API_HOST_PORT moves it when another project on the host already has 5000.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5000}:8080"

volumes:
  pgdata:
  dpkeys:
